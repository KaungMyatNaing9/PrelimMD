services:
  db:
    image: postgres:16-alpine
    container_name: prelimmd-db
    environment:
      POSTGRES_DB: prelimmd
      POSTGRES_USER: prelimmd
      POSTGRES_PASSWORD: prelimmd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prelimmd -d prelimmd"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: prelimmd-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://prelimmd:prelimmd@db:5432/prelimmd
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  staff-portal:
    build:
      context: ./frontend/staff-portal
    container_name: prelimmd-staff-portal
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_PATIENT_CHECKIN_URL: http://localhost:3001
    command: sh ./docker-entrypoint.sh
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/staff-portal:/app
      - staff_portal_node_modules:/app/node_modules
      - staff_portal_next:/app/.next
    depends_on:
      - backend

  patient-checkin:
    build:
      context: ./frontend/patient-checkin
    container_name: prelimmd-patient-checkin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh ./docker-entrypoint.sh
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/patient-checkin:/app
      - patient_checkin_node_modules:/app/node_modules
      - patient_checkin_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  staff_portal_node_modules:
  patient_checkin_node_modules:
  staff_portal_next:
  patient_checkin_next:
